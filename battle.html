<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sudoku Battle</title>
    <link rel="stylesheet" href="./styles.css?v=20260531-17" />
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-label="대전 상태">
        <div>
          <div class="mobile-time-title">
            <span>시간</span>
            <strong id="mobileBattleTimer">00:00</strong>
          </div>
        </div>
        <div id="mobileChatPreview" class="mobile-chat-preview" aria-label="최근 채팅"></div>
        <div class="stats">
          <a class="mode-link" href="./index.html">혼자하기</a>
          <div class="stat">
            <span>방 코드</span>
            <strong id="roomCode">----</strong>
          </div>
          <div class="stat">
            <span>시간</span>
            <strong id="battleTimer">00:00</strong>
          </div>
        </div>
      </section>

      <section class="game-layout">
        <div class="board-wrap">
          <div id="battleBoard" class="sudoku-board" aria-label="대전 스도쿠 보드"></div>
        </div>

        <aside class="controls" aria-label="대전 조작">
          <div class="battle-panel" id="setupPanel">
            <label>
              이름
              <input id="playerName" maxlength="14" placeholder="플레이어" />
            </label>
            <label>
              방 코드
              <input id="joinCode" maxlength="6" placeholder="예: A7K2Q9" />
            </label>
            <label>
              만들 방 코드
              <input id="customRoomCode" maxlength="12" placeholder="예: FRIEND1" />
            </label>
            <label>
              지우기 횟수
              <input id="eraseLimit" min="0" max="9" type="number" value="3" />
            </label>
            <label>
              힌트 횟수
              <input id="hintLimit" min="0" max="9" type="number" value="2" />
            </label>
            <label>
              효과음
              <select id="soundPreset">
                <option value="soft">맑은 소리</option>
                <option value="pop">통통 소리</option>
                <option value="bell">벨 소리</option>
                <option value="arcade">게임 소리</option>
                <option value="drum">둥 소리</option>
              </select>
            </label>
            <label>
              효과음 크기
              <input id="soundVolume" min="0" max="100" type="range" value="80" />
            </label>
            <div class="difficulty" role="group" aria-label="대화 모드">
              <button class="difficulty-btn active" data-chat-mode="free">일반대화</button>
              <button class="difficulty-btn" data-chat-mode="earned">게임대화</button>
            </div>
            <div class="difficulty" role="group" aria-label="대전 난이도">
              <button class="difficulty-btn active" data-battle-difficulty="easy">쉬움</button>
              <button class="difficulty-btn" data-battle-difficulty="medium">보통</button>
              <button class="difficulty-btn" data-battle-difficulty="hard">어려움</button>
            </div>
            <div class="actions">
              <button id="joinRoomBtn" class="secondary">참가</button>
              <button id="createRoomBtn" class="primary">방 만들기</button>
            </div>
          </div>

          <div id="playersPanel" class="progress-panel players-panel"></div>

          <section class="chat-panel" aria-label="대전 채팅">
            <div id="chatMessages" class="chat-messages" aria-live="polite"></div>
            <div class="chat-form">
              <input id="chatInput" maxlength="120" placeholder="메시지 입력" />
              <button id="sendChatBtn" class="primary" type="button">전송</button>
            </div>
          </section>

          <div class="number-pad" aria-label="숫자 입력">
            <button data-battle-number="1">1</button>
            <button data-battle-number="2">2</button>
            <button data-battle-number="3">3</button>
            <button data-battle-number="4">4</button>
            <button data-battle-number="5">5</button>
            <button data-battle-number="6">6</button>
            <button data-battle-number="7">7</button>
            <button data-battle-number="8">8</button>
            <button data-battle-number="9">9</button>
          </div>

          <div class="actions battle-actions">
            <button id="battleEraseBtn" class="secondary">지우기</button>
            <button id="hintBtn" class="primary">힌트</button>
            <button id="restartRoomBtn" class="secondary">새 게임</button>
          </div>

          <div id="battleMessage" class="message battle-message" role="status" aria-live="polite">
            방을 만들거나 코드를 입력해서 참가하세요.
          </div>
        </aside>
      </section>

      <div class="mobile-bottom-stats" aria-label="방 정보">
        <a class="mode-link" href="./index.html">혼자하기</a>
        <div class="stat">
          <span>방 코드</span>
          <strong id="mobileRoomCode">----</strong>
        </div>
      </div>

      <button id="leaveRoomBtn" class="secondary danger leave-action">방 나가기</button>
    </main>

    <script type="module" src="./battle.js?v=20260531-17"></script>
  </body>
</html>
