<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf7ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="뽀요 스도쿠" />
    <title>뽀요 스도쿠</title>
    <link rel="manifest" href="./manifest.webmanifest?v=20260531-26" />
    <link rel="stylesheet" href="./styles.css?v=20260531-26" />
  </head>
  <body>
    <button id="settingsBtn" class="settings-fab" type="button" aria-label="개인 설정">⚙</button>

    <main class="home-screen" id="homeScreen">
      <section class="home-card" aria-label="뽀요 스도쿠 시작">
        <h1>뽀요 스도쿠</h1>
        <p>논리와 추리의 퍼즐 게임</p>

        <div class="home-actions">
          <button id="soloStartBtn" class="home-choice solo-choice" type="button">
            <span class="choice-icon">♙</span>
            <span>
              <strong>혼자하기</strong>
              <small>난이도를 선택하고 도전하세요</small>
            </span>
          </button>
          <a class="home-choice battle-choice" href="./battle.html?v=20260531-26">
            <span class="choice-icon">♧</span>
            <span>
              <strong>뽀요대전</strong>
              <small>친구와 함께 대결하세요</small>
            </span>
          </a>
        </div>

        <div class="home-tip">🏆 미션을 완료하고 더 어려운 난이도에 도전하세요!</div>
      </section>
    </main>

    <main class="app-shell solo-shell is-hidden" id="soloGame">
      <section class="topbar solo-topbar" aria-label="게임 상태">
        <div>
          <a class="back-link" href="./index.html" aria-label="처음으로">←</a>
        </div>
        <h2 class="screen-title"><span>🌱</span> 쉬움</h2>
        <button id="soloFocusBtn" class="focus-button" type="button">집중</button>
        <div class="timer-chip" id="timer">00:00</div>
      </section>

      <section class="solo-content">
        <div class="difficulty" role="group" aria-label="난이도 선택">
          <button class="difficulty-btn active" data-difficulty="easy">쉬움</button>
          <button class="difficulty-btn" data-difficulty="medium">보통</button>
          <button class="difficulty-btn" data-difficulty="hard">어려움</button>
        </div>

        <div id="progress" class="progress-panel mission-panel" aria-live="polite"></div>

        <div class="board-wrap">
          <div id="board" class="sudoku-board" aria-label="스도쿠 보드"></div>
        </div>

        <aside class="controls" aria-label="게임 조작">
          <div id="message" class="message solo-message" role="status" aria-live="polite">
            빈 칸을 선택하고 숫자를 입력하세요.
          </div>

          <div class="number-pad" aria-label="숫자 입력">
            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
          </div>

          <div class="actions">
            <button id="eraseBtn" class="secondary">지우기</button>
            <button id="hintBtn" class="secondary">힌트</button>
            <button id="newGameBtn" class="primary">새 게임</button>
          </div>

          <div class="tool-summary">
            <div><strong id="mistakes">0</strong><span>실수</span></div>
            <div><strong id="currentDifficulty">쉬움</strong><span>난이도</span></div>
          </div>
        </aside>
      </section>
    </main>

    <div id="settingsModal" class="modal-overlay is-hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <section class="settings-modal">
        <div class="modal-head">
          <h2 id="settingsTitle">⚙ 개인 설정</h2>
          <button id="closeSettingsBtn" class="icon-button" type="button" aria-label="닫기">×</button>
        </div>
        <label class="setting-row">
          <span>🔊 사운드</span>
          <input id="soundToggle" type="checkbox" checked />
        </label>
        <label class="setting-control">
          <span>배경음 크기 <strong id="musicVolumeLabel">70%</strong></span>
          <input id="musicVolume" min="0" max="100" type="range" value="70" />
        </label>
        <label class="setting-control">
          <span>효과음 크기 <strong id="effectVolumeLabel">50%</strong></span>
          <input id="effectVolume" min="0" max="100" type="range" value="50" />
        </label>
        <label class="setting-control">
          <span>효과음 선택</span>
          <select id="settingsSoundPreset">
            <option value="soft">맑은 소리</option>
            <option value="pop">통통 소리</option>
            <option value="bell">벨 소리</option>
            <option value="arcade">게임 소리</option>
            <option value="drum">둥 소리</option>
          </select>
        </label>
        <label class="setting-control color-setting">
          <span>메시지창 색상 <strong id="chatColorLabel">#6F2CFF</strong></span>
          <input id="chatColor" type="color" value="#6f2cff" />
        </label>
        <label class="setting-control color-setting">
          <span>메시지 글씨색 <strong id="chatTextColorLabel">#FFFFFF</strong></span>
          <input id="chatTextColor" type="color" value="#ffffff" />
        </label>
        <label class="setting-control">
          <span>메시지 글씨체</span>
          <select id="chatFont">
            <option value="system">기본 글씨체</option>
            <option value="rounded">둥근 글씨체</option>
            <option value="serif">차분한 글씨체</option>
            <option value="mono">게임 글씨체</option>
            <option value="bold">굵은 글씨체</option>
          </select>
        </label>
        <div class="settings-tip">💡 설정은 자동으로 저장되며 다음 접속 시에도 유지됩니다.</div>
      </section>
    </div>

    <script src="./app.js?v=20260531-26"></script>
  </body>
</html>
